<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2329">
<title>Schilder-Scanner</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<main>
  <h1>Schilder-Scanner</h1>
  <p id="status">Kamera starten oder ein Foto wählen.</p>
  <div class="stage">
    <canvas id="view" width="640" height="480"></canvas>
    <!-- Das Video wird nie angezeigt, nur als Bildquelle für das Canvas genutzt -->
    <video id="video" playsinline muted></video>
  </div>
  <div class="row">
    <button id="camBtn" type="button">Kamera starten</button>
    <label class="btn">Foto wählen<input id="file" type="file" accept="image/*"></label>
  </div>
  <div class="row tune">
    <label>Farbstrenge <input id="sat" type="range" min="0.15" max="0.8" step="0.05" value="0.38"> <output id="satOut">0.38</output></label>
    <label><input id="maskCb" type="checkbox"> Farbmasken zeigen</label>
  </div>
  <details class="backend-settings">
    <summary>PC-Backend</summary>
    <label>Backend-Adresse
      <input id="backendUrl" type="url" placeholder="http://localhost:8765/api/signs" autocomplete="url">
    </label>
    <small id="backendStatus">Noch nicht verbunden</small>
  </details>
  <ul id="list"></ul>
</main>
<script src="src/detector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="src/app.js"></script>
</body>
</html>
